name: Paid LLM regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stockfish-to-openrouter:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".\backend[dev]"
      - name: Install pinned Stockfish 19
        shell: pwsh
        run: .\scripts\install-stockfish.ps1
      - name: Run fixed paid regression matrix
        working-directory: backend
        env:
          STOCKFISH_PATH: ${{ github.workspace }}\backend\vendor\stockfish\stockfish-windows-x86-64-universal.exe
          LLM_API_BASE_URL: https://openrouter.ai/api/v1
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: google/gemini-3.1-flash-lite
          LLM_MAX_OUTPUT_TOKENS: 3200
        run: python scripts\regression_llm.py
