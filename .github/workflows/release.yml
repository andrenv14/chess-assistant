name: Signed Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: npm ci
      - run: python -m pip install -e ".\backend[dev,package]"
      - shell: pwsh
        run: .\scripts\install-stockfish.ps1
      - run: npm test
      - run: npm run typecheck
      - name: Build and sign installer
        run: npm run package:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Require a valid Authenticode signature
        shell: pwsh
        run: .\scripts\verify-signature.ps1 -RequireTrusted
      - uses: actions/upload-artifact@v7
        with:
          name: chess-assistant-windows-signed
          path: |
            apps/desktop/release/Chess-Assistant-*-Setup.exe
            apps/desktop/release/Chess-Assistant-*-Setup.exe.blockmap
          if-no-files-found: error
