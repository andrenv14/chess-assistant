[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chess-assistant-backend"
version = "0.1.0"
description = "Local Stockfish and analysis API for Chess Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "python-chess>=1.999,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that launch an installed native engine",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
